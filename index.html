<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>엄청난 사냥꾼 되기</title><link rel="stylesheet" href="style.css"></head>
<body><main id="gameShell">
  <canvas id="game" aria-label="엄청난 사냥꾼 되기 캔버스 게임"></canvas>
  <header class="overlay masthead"><small>WILDERNESS SURVIVAL</small><h1>엄청난 사냥꾼 되기</h1><span id="zoneName">오두막</span></header>
  <section class="overlay vital-panel"><div class="vital hp"><b>HP</b><i><em id="hpBar"></em></i><span id="hpText">100</span></div><div class="vital hunger"><b>배고픔</b><i><em id="hungerBar"></em></i><span id="hungerText">100</span></div><div class="vital temp"><b>체온</b><i><em id="tempBar"></em></i><span id="tempText">100</span></div></section>
  <div class="overlay clock" id="clock">낮 · 07:00</div>
  <section class="overlay inventory"><button id="bagToggle">주머니 <b id="bagCount">0</b></button><div id="bagPanel" hidden><h2>사냥 주머니</h2><div id="bag"></div></div></section>
  <button class="overlay interaction" id="interact" hidden>상호작용</button><button class="overlay cook" id="cook" hidden>고기 굽기</button>
  <div class="overlay hint" id="message">오두막에서 생존 준비를 시작하세요.</div>
  <section class="overlay modal" id="workbench" hidden><header><h2>낡은 제작대</h2><button id="closeWorkbench">닫기</button></header><p>가죽과 자원을 엮어 더 오래 살아남으세요.</p><div id="recipes"></div></section>
  <section class="touch-controls"><div id="joystick"><i></i></div><button id="touchAction">공격</button><button id="touchDash">대시</button><button id="touchInteract">사용</button></section>
</main><script src="script.js"></script></body></html>
