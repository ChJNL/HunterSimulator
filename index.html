<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황야의 추적자</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell">
<header><div><p>WILDERNESS ACTION RPG</p><h1>황야의 추적자</h1></div><b>WASD/방향키 이동 · Space/Shift 대시 · 클릭 공격</b></header>
<section class="layout"><div class="world"><canvas id="game" width="960" height="600"></canvas><span id="notice">숲 가장자리에서 사냥을 시작합니다.</span></div>
<aside><section class="panel"><p>HUNTER</p><h2 id="ground">숲 가장자리</h2><div>무기 <b id="weapon">견습 활</b></div><div>대시 <b id="dash">준비</b></div><button id="travel">안개 숲으로 이동</button></section><section class="panel"><p>PACK</p><h2>인벤토리</h2><div id="bag"></div></section></aside></section>
<section class="panel forge"><div><p>FIELD CRAFTING</p><h2>야전 제작대</h2><small>제작 즉시 투사체가 강해집니다.</small></div><div id="recipes"></div></section>
<footer><button id="reset">진행 초기화</button><span>진행 상황은 Local Storage에 저장됩니다.</span></footer>
</main><script src="script.js"></script></body></html>
